name: RTL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_gds:
        description: 'Run RTL-to-GDS flow'
        required: false
        default: 'false'
        type: boolean

jobs:
  simulate-and-synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Run PWM DAC simulation
        run: make sim_pwm

      - name: Run Sigma-Delta DAC simulation
        run: make sim_sd

      - name: Run Yosys synthesis check
        run: make synth_check

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: build/*.csv
          if-no-files-found: warn

  rtl-to-gds:
    runs-on: ubuntu-latest
    needs: simulate-and-synth
    # Run on: push to main, OR manual dispatch with run_gds=true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_gds == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenLane and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
          python -m pip install --upgrade pip
          pip install openlane volare

      - name: Install sky130 PDK via Volare
        run: |
          volare enable --pdk sky130 78b7bc32ddb4b6f14f76883c2e2dc5b5de9d1cbc

      - name: Run OpenLane RTL-to-GDS flow
        run: |
          mkdir -p runs
          openlane openlane/config.json --pdk sky130A

      - name: List output files
        if: always()
        run: |
          echo "=== OpenLane output structure ==="
          find runs -type f -name "*.gds" -o -name "*.lef" -o -name "*.v" -o -name "*.rpt" -o -name "*.log" 2>/dev/null | head -50 || true
          echo "=== Full tree ==="
          ls -laR runs/ 2>/dev/null | head -100 || true

      - name: Upload GDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gds-output
          path: |
            runs/*/final/gds/
            runs/*/final/lef/
            runs/*/final/nl/
            runs/*/final/pnl/
            runs/*/final/sdc/
            runs/*/final/sdf/
            runs/*/final/spef/
          if-no-files-found: warn

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: openlane-reports
          path: |
            runs/*/**/*.rpt
            runs/*/**/*summary*
            runs/*/METRICS.json
          if-no-files-found: warn

      - name: Upload full run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlane-logs
          path: |
            runs/*/*.log
            runs/*/openlane.log
          if-no-files-found: warn
