name: RTL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_gds:
        description: 'Run RTL-to-GDS flow'
        required: false
        default: 'false'
        type: boolean

jobs:
  simulate-and-synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Run PWM DAC simulation
        run: make sim_pwm

      - name: Run Sigma-Delta DAC simulation
        run: make sim_sd

      - name: Run Yosys synthesis check
        run: make synth_check

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: build/*.csv
          if-no-files-found: warn

  rtl-to-gds:
    runs-on: ubuntu-latest
    needs: simulate-and-synth
    # Run on: push to main, OR manual dispatch with run_gds=true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_gds == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Run OpenLane RTL-to-GDS
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/openlane/designs/dac_top \
            -v ${{ github.workspace }}/runs:/openlane/designs/dac_top/runs \
            -e PDK=sky130A \
            efabless/openlane:latest \
            bash -c "flow.tcl -design dac_top -config_file designs/dac_top/openlane/config.tcl"

      - name: Upload GDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gds-output
          path: |
            runs/*/results/final/gds/*.gds
            runs/*/results/final/lef/*.lef
            runs/*/results/final/verilog/gl/*.v
            runs/*/reports/**
          if-no-files-found: warn

      - name: Upload full run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlane-logs
          path: runs/*/logs/**
          if-no-files-found: warn
