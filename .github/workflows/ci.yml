name: RTL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_gds:
        description: 'Run RTL-to-GDS flow'
        required: false
        default: 'false'
        type: boolean

jobs:
  simulate-and-synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Run PWM DAC simulation
        run: make sim_pwm

      - name: Run Sigma-Delta DAC simulation
        run: make sim_sd

      - name: Run Yosys synthesis check
        run: make synth_check

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: build/*.csv
          if-no-files-found: warn

  rtl-to-gds:
    runs-on: ubuntu-latest
    needs: simulate-and-synth
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_gds == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Run OpenLane2 RTL-to-GDS
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            efabless/openlane2:latest \
            openlane openlane/config.json

      - name: Upload GDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gds-output
          path: |
            runs/*/final/gds/*.gds
            runs/*/final/lef/*.lef
            runs/*/final/nl/*.v
            runs/*/reports/**
          if-no-files-found: error

      - name: Upload full run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlane-logs
          path: runs/*/logs/**
          if-no-files-found: warn
